seed: 17

output_train_data_dir: "data/saved_features/nn_train_data"
output_nn_plots_dir: "outputs/plots_nn/global_full_ft_transformer"
nn_output_model_path: "models/nn_global_full_ft_transformer.ckpt"
nn_metrics_path: "outputs/nn_global_full_ft_transformer/metrics.json"

batch_size: 384
epochs: 30
num_workers: 0
selection_metric: val_f1
compute_train_metrics: false

class_weights:
  0: 1.0
  1: 2.0

nn_model:
  architecture: ft_transformer
  params:
    token_dim: 96
    num_layers: 3
    num_heads: 8
    ffn_dim: 256
    dropout: 0.12
    dynamic_mode: flatten
    head_units: 96
    head_dropout: 0.08
    norm_first: false
    categorical_mode: embedding
  lightning:
    learning_rate: 0.0007
    l2: 0.00005
    clip_gradient_norm: 5.0
    log_train_ap: false
    scheduler_config:
      type: cosine
      interval: epoch
      frequency: 1
      params:
        T_max: 30
        eta_min: 0.00001
  trainer:
    enable_progress_bar: false
    early_stopping:
      patience: 14
      min_delta: 0.0005
