seed: 17

output_train_data_dir: "data/saved_features/nn_train_data"
output_nn_plots_dir: "outputs/plots_nn/global_full_lstm_static_concat"
nn_output_model_path: "models/nn_global_full_lstm_static_concat.ckpt"
nn_metrics_path: "outputs/nn_global_full_lstm_static_concat/metrics.json"

batch_size: 4096
epochs: 15
num_workers: 0
selection_metric: val_f1
compute_train_metrics: false

class_weights:
  0: 1.0
  1: 2.0

nn_model:
  architecture: lstm_mlp
  params:
    lstm_units: 256
    dropout_lstm: 0.1
    static_units: 512
    dropout_static: 0.05
    merge_units: 384
    dropout_merged: 0.2
    categorical_mode: raw
  lightning:
    learning_rate: 0.002
    l2: 0.0001
    clip_gradient_norm: 5.0
    log_train_ap: false
    scheduler_config:
      type: cosine
      interval: epoch
      frequency: 1
      params:
        T_max: 15
        eta_min: 0.00005
  trainer:
    enable_progress_bar: false
