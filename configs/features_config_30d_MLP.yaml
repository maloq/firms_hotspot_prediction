# Training data generation paths
train_features_parquet_path: "data/saved_features/train_features_nn_30d_06cb.parquet"
config_path: "configs/features_config_30d_nn.yaml"
output_plots_dir: "outputs/plots"
output_train_data_dir: "data/saved_features/nn_train_data"
target_cache_path: "data/saved_features/target_data.parquet"

cat_features: ["ecoregion_name", "ecoregion_realm", "slt", "tvl", "tvh", "slt_soil_type_stream_oper_daily_mean"]
numerical_cat_features: ["slt", "tvl", "tvh", "slt_soil_type_stream_oper_daily_mean"]

nn_preprocessing:
  encoders_meta_path: "data/saved_features/nn_train_data/encoders_meta.joblib"
  cat_one_hot_threshold: 200
  allow_ordinal_fallback: false
  add_missing_indicators: true
  scale_static: true
  log_population: true
  ignored_features: ["datetime", "day", "latitude", "longitude", "year"]

batch_size: 2048
epochs: 50
num_workers: 6

# Neural network architecture options.
# Available architectures: lstm_mlp (default), lstm_attention.
nn_model:
  architecture: lstm_early_fusion
  params: {}
  lightning:
    learning_rate: 0.001
    decay_rate: 0.5
    l2: 0.0001
    clip_gradient_norm: 5.0
    scheduler_config:
      type: reduce_on_plateau
      monitor: val_ap
      params:
        mode: max
        factor: 0.5
        patience: 3
        min_lr: 0.00001
  trainer: {}
  # Example for attention-based model:
