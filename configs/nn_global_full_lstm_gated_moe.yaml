seed: 31

output_train_data_dir: "data/saved_features/nn_train_data"
output_nn_plots_dir: "outputs/plots_nn/global_full_lstm_gated_moe"
nn_output_model_path: "models/nn_global_full_lstm_gated_moe.ckpt"
nn_metrics_path: "outputs/nn_global_full_lstm_gated_moe/metrics.json"

batch_size: 4096
epochs: 15
num_workers: 0
selection_metric: val_f1
compute_train_metrics: false

class_weights:
  0: 1.0
  1: 2.0

nn_model:
  architecture: lstm_gated_moe
  params:
    lstm_units: 192
    num_layers: 1
    bidirectional: true
    use_attention: true
    dropout_lstm: 0.15
    static_units: 384
    dropout_static: 0.1
    fusion_units: 384
    dropout_merged: 0.15
    num_experts: 4
    expert_units: 192
    gate_hidden_units: 192
    categorical_mode: embedding
  lightning:
    learning_rate: 0.002
    l2: 0.0001
    clip_gradient_norm: 5.0
    log_train_ap: false
    scheduler_config:
      type: cosine
      interval: epoch
      frequency: 1
      params:
        T_max: 15
        eta_min: 0.00005
  trainer:
    enable_progress_bar: false
