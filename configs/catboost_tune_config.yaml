catboost_tune:
  feature_config_path: "configs/features_config_30d.yaml"

  run:
    output_root: "outputs"
    run_prefix: "catboost_tune"

  data:
    features_path: "data/saved_features_boost/train_test_features_30d_all_extended_north_14cb.parquet"
    rebuild_features: false
    per_country_features_dir: "data/saved_features"
    per_country_pattern: "train_test_features_30d_{country}.parquet"
    limit_rows: null
    countries:
      - "Dem_Rep_Korea"
      - "Russian_Federation"
      - "Finland"
      - "Norway"
      - "Sweden"
      - "Denmark"
      - "Lithuania"
      - "Latvia"
      - "Estonia"
      - "Poland"
      - "Czech_Republic"
      - "Germany"
      - "Hungary"
      - "Slovakia"
      - "Belarus"
      - "Ukraine"
      - "Moldova"
      - "Romania"
      - "Bulgaria"
      - "Albania"
      - "Montenegro"
      - "Macedonia_Former_Yugoslav_Republic_of"
      - "Kosovo"
      - "Serbia"
      - "Croatia"
      - "Bosnia_and_Herzegovina"
      - "Slovenia"
      - "Greece"
      - "Turkey"
      - "Georgia"
      - "Azerbaijan"
      - "Armenia"
      - "Kazakhstan"
      - "Kyrgyzstan"
      - "Tajikistan"
      - "Mongolia"
      - "China"
      - "Japan"
      - "Republic_of_Korea"

  target:
    column: "count"
    positive_threshold: 0.0

  split:
    date_column: "datetime"
    validation_start_date: "2021-01-01"
    test_start_date: "2023-01-01"
    validation_size: 0.15
    test_size: 0.15
    shuffle: false
    random_state: 42

  features:
    selected_features_path: null
    selected_feature_filter: true
    ignored: ["datetime", "day", "latitude", "longitude", "year", "lon_rounded"]
    drop_features: []
    drop_feature_prefixes: []
    drop_feature_groups: []
    feature_weights:
      ecoregion_name: 0.3
      lat_rounded: 0.3

  search:
    strategy: "random"
    max_trials: 1000
    seed: 17
    fail_fast: false
    space: "wide"

  model:
    loss_function: "Logloss"
    eval_metric: "F1"
    early_stopping_rounds: 250
    verbose: 0

  hardware:
    task_type: "GPU"
    devices: null
    thread_count: null
    gpu_ram_part: null

  sampling:
    train_sample_frac: 1.0
    max_train_rows: null

  feature_search:
    mode: "wide"
    importance_csv: null
    top_k_choices: "25,40,60,80,120,160,220,300,all"
    top_k_probability: 0.80
    max_drop_groups: 4
    drop_group_probability: 0.55
    group_sample_probability: 0.35
    group_sample_fraction_choices: "0.40,0.55,0.70,0.85,1.0"
    column_sample_probability: 0.60
    column_sample_fraction_choices: "0.25,0.35,0.50,0.65,0.80,0.90,1.0"
    min_features: 20
    protected_features: []

  objective:
    split: "test"
    metric: "average_precision"
    train_test_gap_weight: 0.0
    validation_test_gap_weight: 0.0
    train_validation_gap_weight: 0.0

  thresholding:
    prediction_threshold: null
    min_precision: null
    min_recall: null

  persistence:
    save_every_model: false
