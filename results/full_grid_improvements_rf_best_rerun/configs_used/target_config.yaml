# Target generation from MODIS:
spatial_coarseness: 0.1
brightness_threshold: 380
confidence_threshold: 0.85
brightness_threshold_high_lat: 360
confidence_threshold_high_lat: 0.70
filter_stationary_points: true
stationary_points_dir: data/modis_stationary_points
use_high_latitude_filter: true

positive_count_boost_regions: []

positive_label_filter:
  # Drop likely non-wildfire MODIS positives before grouping/expansion. This
  # removes detections over water/non-burnable cells and very bright urban cores
  # such as Moscow, where thermal detections are often industrial/city artifacts.
  enabled: true
  require_land: true
  require_burnable_landcover: true
  keep_unknown_static: true
  landseamask_land_threshold: 70
  min_burnable_cover: 0.05
  burnable_cover_feature_columns:
    - forest_cover
    - tree_cover
    - lai_hv
    - lai_lv
  burnable_categorical_feature_columns:
    - tvl
    - tvh
    - type_of_low_vegetation
    - type_of_high_vegetation
  landcover_file_keywords:
    - forest
    - vegetation
    - land_sea
    - landsea
    - landseamask
    - type_of_high_vegetation
    - type_of_low_vegetation
  use_night_light_artifact_filter: true
  max_night_light_radiance: 50.0
  night_light_artifact_columns:
    - night_light_black_marble_quality_filtered
    - night_light_black_marble_recent
    - night_light_radiance_recent
    - night_light_radiance_2024
  max_population: null

negative_sampling:
  # Use all MODIS positives and sample negatives from deployment-like strata.
  # With target_positive_fraction=0.10, the sampler adds about 9 negatives per
  # positive after positive grouping/expansion and coordinate clipping.
  strategy: stratified
  target_positive_fraction: 0.15
  stratum_weights:
    near_fire_hard: 0.10
    large_city_hard: 0.15
    same_season: 0.20
    same_ecoregion: 0.15
    same_burnable_landcover: 0.20
    random_background: 0.20
  exclude_positive_buffer_cells: 1
  exclude_positive_buffer_days: 1
  near_fire_min_cells: 2
  near_fire_max_cells: 5
  near_fire_day_window: 7
  match_month_for_static_strata: true
  max_attempt_multiplier: 80
  use_ecoregion: true
  use_landcover: true
  landseamask_land_threshold: 70
  large_city_min_population: 50000
  large_city_min_samples_per_cell: 1
  large_city_require_land: true
  large_city_population_columns:
    - population
  large_city_file_keywords:
    - population
  burnable_feature_columns:
    - forest_cover
    - tree_cover
    - lai_hv
    - lai_lv
    - tvl
    - tvh
    - type_of_low_vegetation
    - type_of_high_vegetation
  landcover_match_columns:
    - tvl
    - tvh
    - forest_cover
    - tree_cover
  landcover_file_keywords:
    - forest
    - vegetation
    - land_sea
    - landsea
    - landseamask
    - type_of_high_vegetation
    - type_of_low_vegetation

soft_labels:
  # Keep hard MODIS labels in count, but make near-fire hard negatives
  # partially positive for training uncertainty.
  enabled: true
  column: soft_label
  max_negative_label: 0.35
  spatial_decay_cells: 2.0
  temporal_decay_days: 7.0
  max_distance_cells: 5
  max_delta_days: 7
  distance_column: nearest_positive_distance_cells
  delta_days_column: nearest_positive_delta_days

recent_fire_history:
  # Historical fire tendency with a one-month embargo. These features do not
  # use fires from the 30 days immediately before the target date.
  enabled: true
  radii_cells: [0, 1, 2]
  min_lag_days: 32
  count_windows:
    - name: last_month
      start_days: 32
      end_days: 60
    - name: last_year
      start_days: 30
      end_days: 395
  include_days_since: false
  days_since_radii_cells: []
  days_since_cap: 365
