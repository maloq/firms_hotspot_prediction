selected_feature_columns_path: "configs/selected_columns_30d.txt"
prepared_prediction_features_path: "data/saved_features_boost/train_test_features_30d_all_extended_north_14cb_new.parquet"
model_path: "models/catboost_fire_model_30d.cbm"

evaluation:
  features_path: "data/saved_features_boost/train_test_features_30d_all_extended_north_14cb.parquet"
  regions_file: "configs/regions_example.yaml"
  lat_column: "lat_rounded"
  lon_column: "lon_rounded"
  target_column: "count"
  target_positive_threshold: 0.0
  threshold: 0.5


# Feature generation configuration
# Should be the same for train, test and prediction

# Target generation from MODIS settings:
modis_data_path: "/home/ids/vmorozov/data/modis"
modis_countries:
  - 'Russian_Federation'
target_samples_per_area_per_year: 18
target_start_date: "2000-01-01"
target_end_date: "2025-10-02"
coordinate_bounds: [35, 6, 75, 179]

climate_data_params:
  climate_data_dir: "/home/ids/vmorozov/data/climate_data/climate_features/ECMWF"
  climate_variables: ["t2m", "d2m", "tp", "stl1"]
  n_days: 128


skip_climate: False

climate_data_params_prediction:
  climate_data_dir: "/home/ids/vmorozov/data/climate_data/climate_features/ECMWF_prediction"
  climate_variables: ["t2m", "d2m", "tp", "stl1"]
  n_days: 128

# Climate feature generation parameters
generate_climate_params:
  max_length: 128
  trend_window: [21, 90]
  lags: [7, 14, 30, 90, 120]
  windows: [7, 14, 30, 90, 120]
  spans: [7, 14, 30, 90, 120]
  features_to_include:
    t2m: ["rolling", "diff", "pct_change", "trend", "ewm", "rolling_ext", ]
    tp: ["rolling", "ewm", "rolling_ext"]
    d2m: [ "rolling", "ewm", "diff", "pct_change", "trend", "rolling_ext"]
    stl1: ["rolling", "trend", "ewm", "rolling_ext"]
  

# Elevation data parameters
elevation_data_params:
  elevation_file: "/home/ids/vmorozov/data/climate_data/land_features/GMTED2010_15n015_00625deg.nc"
  window_size: [0.1, 0.20]

# Road data parameters
road_data_params:
  use_road_features: true
  feature_map_path: "data/land_features/osm_drivable_roads_features_1km"
  kernels_km: [5, 10, 25]

# Night-light data parameters
night_light_data_params:
  use_night_light_features: true
  feature_map_path: "/home/ids/vmorozov/data/climate_data/land_features/night_lights_black_marble_features_1km"
  source_year: 2024
  black_marble_source_dir: "/home/ids/vmorozov/data/climate_data/night_lights/black_marble_vnp46a4"
  black_marble_cache_path: "/home/ids/vmorozov/data/climate_data/night_lights/black_marble_vnp46a4_point_cache.parquet"
  black_marble_missing_tile_fallback: "feature_map"
  black_marble_fallback_feature_name: "night_light_radiance_2024"
  kernels_km: [5, 10, 25]
  light_threshold: 0

# Fire data parameters. Not used
fire_data_params:
  density_radii_km: 50

# Land data parameters
land_data_params:
  land_data_files: ["/home/ids/vmorozov/data/climate_data/land_features/forest_data.nc",
                    "/home/ids/vmorozov/data/climate_data/land_features/IMERG_land_sea_mask.nc",
                    "/home/ids/vmorozov/data/climate_data/land_features/kontur_population_20231101_r6.gpkg",
                    "/home/ids/vmorozov/data/climate_data/land_features/topography.nc",
                    "/home/ids/vmorozov/data/climate_data/land_features/type_of_high_vegetation_0_daily-mean.nc",
                    "/home/ids/vmorozov/data/climate_data/land_features/type_of_low_vegetation_0_daily-mean.nc",
                    "/home/ids/vmorozov/data/climate_data/land_features/soil_type_stream-oper_daily-mean.nc"]
                    
  landsea_mask_path: "/home/ids/vmorozov/data/climate_data/land_features/IMERG_land_sea_mask.nc"
  landsea_distance_path: "/home/ids/vmorozov/data/climate_data/land_features/IMERG_land_sea_mask_distances.nc"
  fire_index_npz_path: "/home/ids/vmorozov/data/climate_data/land_features/fire_index_features.npz"
  wwf_shp_path: "data/wwf_terr_ecos"

country_shapes_path: "data/countries"

cat_features: ["country", "ecoregion_name", "ecoregion_realm", "slt", "tvl", "tvh", "slt_soil_type_stream_oper_daily_mean"]
numerical_cat_features: ["slt", "tvl", "tvh", "slt_soil_type_stream_oper_daily_mean"]
