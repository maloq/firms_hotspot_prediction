seed: 17

output_train_data_dir: "data/saved_features/nn_train_data"
output_nn_plots_dir: "outputs/plots_nn/global_full_minimal_mlp"
nn_output_model_path: "models/nn_global_full_minimal_mlp.ckpt"
nn_metrics_path: "outputs/nn_global_full_minimal_mlp/metrics.json"

batch_size: 4096
epochs: 15
num_workers: 6
selection_metric: val_f1
compute_train_metrics: false

class_weights:
  0: 1.0
  1: 2.0

nn_model:
  architecture: minimal_mlp
  params:
    hidden_units: 128
    dropout: 0.1
    dynamic_mode: flatten
    categorical_mode: ignore
  lightning:
    learning_rate: 0.001
    l2: 0.0001
    clip_gradient_norm: 5.0
    log_train_ap: false
    scheduler_config:
      type: cosine
      interval: epoch
      frequency: 1
      params:
        T_max: 15
        eta_min: 0.00005
  trainer:
    enable_progress_bar: false
